[project]
name = "kioskbot-etl"
version = "0.1.2"
description = "ETL for Kioskbot project"
readme = "README.md"
requires-python = "==3.12.11"

dependencies = [
    "langchain==0.3.27",
    "azure-search-documents==11.6.0",
    "azure-identity==1.24.0",
    "openai==1.104.2",
    "langchain_core==1.2.28",
    "dotenv==0.9.9",
    "langchain_openai==0.3.32",
    "ftfy==6.3.1",
    "fastapi==0.116.1",
    "azure-data-tables==12.7.0",
    "uvicorn==0.35.0",
    "pydantic_settings==2.10.1",
    "pandas==2.3.2",
    "azure-storage-blob==12.26.0",
    "ruff==0.12.11",
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "openevals==0.1.0",
    "scrapy==2.14.2",
    "beautifulsoup4==4.13.5",
    "lxml==6.0.1",
    "pytest-playwright==0.7.1",
    "playwright==1.55.0",
    "openpyxl==3.1.5",
    "langchain-experimental==0.3.4",
    "locust==2.42.6",
    "pdfplumber==0.11.9"
]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", 
]

pydocstyle.convention = "google"